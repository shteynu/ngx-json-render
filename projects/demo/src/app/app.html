<header class="topbar">
  <div>
    <h1>ngx-json-render <span class="version">demo</span></h1>
    <p>Angular renderer for json-render — specs in, components out.</p>
  </div>
  <nav class="tabs">
    <button
      type="button"
      [class.active]="tab() === 'playground'"
      (click)="tab.set('playground')"
    >
      Playground
    </button>
    <button
      type="button"
      [class.active]="tab() === 'interactive'"
      (click)="tab.set('interactive')"
    >
      Interactive
    </button>
    <button
      type="button"
      [class.active]="tab() === 'streaming'"
      (click)="tab.set('streaming')"
    >
      Streaming
    </button>
    <button
      type="button"
      [class.active]="tab() === 'chat'"
      (click)="tab.set('chat')"
    >
      Chat
    </button>
  </nav>
</header>

@if (tab() === 'streaming' || tab() === 'chat') {
  <app-key-panel />
}

@if (tab() === 'playground') {
  <app-playground />
} @else if (tab() === 'interactive') {
  <app-interactive
    [spec]="spec()"
    [specJson]="specJson()"
    [log]="log()"
    [handlers]="handlers"
    [onAction]="onUnknownAction"
    (stateChange)="onStateChange($event)"
    (ready)="onRendererReady($event)"
  />
} @else if (tab() === 'streaming') {
  <app-stream />
} @else {
  <app-chat />
}
