name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10
      - name: Update npm
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./projects/ngx-json-render/package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      # --coverage is what turns on the coverageThresholds in angular.json;
      # without it this gate is weaker than the one CI already applied to the
      # same commit, which is the wrong way round for the step that publishes.
      - name: Test library
        run: npx ng test ngx-json-render --coverage

      - name: Copy LICENSE into package
        run: cp LICENSE dist/ngx-json-render/

      - name: Publish to npm
        run: npm publish
        working-directory: dist/ngx-json-render

  github-release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
