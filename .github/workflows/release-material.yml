name: Release Material catalog

# Versioned independently of the renderer: tag `material-v0.1.0` to publish
# `ngx-json-render-material`, `v0.1.3` to publish `ngx-json-render`.
on:
  push:
    tags: ['material-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    # Whether the package actually reached npm, which is not the same as this
    # job going green: the verification below runs after the publish and
    # cannot un-publish anything.
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10
      - name: Update npm
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./projects/ngx-json-render-material/package.json').version")
          if [ "material-v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version material-v$PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # The catalog declares a peer range on the renderer; publishing one that
      # excludes the renderer version users get from `latest` is an ERESOLVE
      # for everyone who follows the README. Runs after the install because it
      # reads semver out of node_modules.
      - name: Check peer ranges between workspace packages
        run: npm run check:peers

      # The catalog compiles against the renderer's build output.
      - name: Build renderer
        run: npm run build:lib

      - name: Build Material catalog
        run: npm run build:material

      # The catalog's runner reports its results and then never exits (see
      # projects/ngx-json-render-material/README.md), so this goes through a
      # script that waits for the report rather than for the process.
      - name: Test Material catalog
        run: npm run test:material

      - name: Copy LICENSE into package
        run: cp LICENSE dist/ngx-json-render-material/

      - name: Publish to npm
        id: publish
        run: |
          npm publish
          echo "published=true" >> "$GITHUB_OUTPUT"
        working-directory: dist/ngx-json-render-material

      # The catalog is the dependent half and ships second, so once it is out
      # the pair has to install coherently — here an incoherent resolution is
      # a hard failure, not the lockstep's expected middle. It catches the
      # case `check:peers` structurally cannot: a peer range that is right in
      # this commit but stale in the version npm is still serving.
      - name: Verify the published package installs as itself
        run: npm run check:published -- ngx-json-render-material

  # Gated on the publish rather than on the publish *job*. Once a version is
  # on npm it cannot be taken back, so the release notes describing it should
  # exist whatever the verification afterwards concluded — otherwise a red
  # check leaves the registry and the releases page disagreeing, which is how
  # v0.4.0 shipped with no release entry. Kept as its own job so the half
  # holding npm's publishing credentials never also holds `contents: write`.
  github-release:
    runs-on: ubuntu-latest
    needs: publish
    if: always() && needs.publish.outputs.published == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
