name: Release Material catalog

# Versioned independently of the renderer: tag `material-v0.1.0` to publish
# `ngx-json-render-material`, `v0.1.3` to publish `ngx-json-render`.
on:
  push:
    tags: ['material-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10
      - name: Update npm
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./projects/ngx-json-render-material/package.json').version")
          if [ "material-v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version material-v$PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # The catalog compiles against the renderer's build output.
      - name: Build renderer
        run: npm run build:lib

      - name: Build Material catalog
        run: npm run build:material

      - name: Copy LICENSE into package
        run: cp LICENSE dist/ngx-json-render-material/

      - name: Publish to npm
        run: npm publish
        working-directory: dist/ngx-json-render-material

  github-release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
