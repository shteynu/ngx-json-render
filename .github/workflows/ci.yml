name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap, and it fails before the builds rather than after them.
      - name: Check formatting
        run: npm run format:check

      # Nothing else in the workspace resolves peer ranges: tsconfig maps both
      # package names to dist/, so npm's view of the manifests is only ever
      # exercised by an install of the published pair.
      - name: Check peer ranges between workspace packages
        run: npm run check:peers

      # The release checks decide whether a publish is broken or merely
      # mid-lockstep, and got that wrong twice before it was tested. Cheap and
      # build-free, so it runs beside the other static checks.
      - name: Test the release scripts
        run: npm run test:scripts

      - name: Build library
        run: npm run build:lib

      # --coverage is what turns on the coverageThresholds each project
      # declares in angular.json; without it the builder collects nothing and
      # has nothing to enforce.
      - name: Test library
        run: npx ng test ngx-json-render --coverage

      # Building the catalog type-checks every component template against it.
      - name: Build Material catalog
        run: npm run build:material

      # Every TypeScript snippet in skills/*/SKILL.md is compiled against the
      # two builds above; an agent reads the skill instead of the README, so a
      # public API change is not done until the skill compiles again.
      - name: Compile the skills' snippets
        run: npm run check:skills

      # `ng add` for both packages, run against a generated Angular workspace.
      # The schematics are compiled by build:lib and build:material into the
      # dist folders the tests load, so this has to come after both builds.
      - name: Test the ng add schematics
        run: npm run test:schematics

      # Runs after both builds so it can read the bundles that actually ship,
      # not only the sources. Nothing else fails on an NgZone import, and a
      # suite that forgot provideZonelessChangeDetection() would still be
      # green — so the zoneless claim needs its own check.
      - name: Check the zoneless guarantee
        run: npm run check:zoneless

      # The catalog's runner reports its results and then never exits (see
      # projects/ngx-json-render-material/README.md), so this goes through a
      # script that waits for the report rather than for the process. The
      # script asks for coverage and checks the thresholds itself, because the
      # builder's own check would come after the point where it gets killed.
      - name: Test Material catalog
        run: npm run test:material

      - name: Test demo
        run: npx ng test demo --coverage

      - name: Build demo
        run: npx ng build demo

      - name: Test MCP App
        run: npx ng test mcp-app --coverage

      - name: Build MCP App
        run: npm run build:mcp-app

      - name: Upload library package
        uses: actions/upload-artifact@v7
        with:
          name: ngx-json-render
          path: dist/ngx-json-render

      - name: Upload Material catalog package
        uses: actions/upload-artifact@v7
        with:
          name: ngx-json-render-material
          path: dist/ngx-json-render-material

  angular-compat:
    name: Angular ${{ matrix.angular }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: [19, 20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Retarget workspace to Angular ${{ matrix.angular }}
        run: node scripts/angular-compat.mjs ${{ matrix.angular }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build library
        run: npx ng build ngx-json-render

      # Angular 19 has no unit-test builder, so on that line the library is
      # only built here; consumer-smoke runs it in a browser instead.
      - name: Test library
        if: matrix.angular != 19
        run: npx ng test ngx-json-render

      # The catalog's own floor is Angular 20: it uses Material 20's button API.
      - name: Build Material catalog
        if: matrix.angular != 19
        run: npx ng build ngx-json-render-material

  # angular-compat compiles the sources on each line. What ships is the
  # package built on the pinned line, linked by the consumer's compiler and
  # type-checked by the consumer's TypeScript — this job installs exactly that
  # into a fresh app and drives it in Chrome.
  consumer-smoke:
    name: Consumer app on Angular ${{ matrix.angular }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: [19, 20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Build and drive a consumer app
        run: node scripts/consumer-smoke.mjs ${{ matrix.angular }}
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

  core-compat:
    name: '@json-render/core ${{ matrix.core }} compatibility'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ['0.20']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The workspace pins the newest core the packages admit, so the main job
      # proves that end; this one proves the floor of the peer range. --no-save
      # leaves the manifests and the lockfile alone: only node_modules changes.
      - name: Retarget @json-render/core to ${{ matrix.core }}
        run: npm install --no-save --no-audit --no-fund @json-render/core@${{ matrix.core }} @json-render/directives@${{ matrix.core }} @json-render/devtools@${{ matrix.core }}

      - name: Build library
        run: npm run build:lib

      # The library runs without --coverage, as in angular-compat. The catalog's
      # runner below always collects coverage and checks its thresholds itself
      # (see AGENTS.md); at the floor they hold with room to spare.
      - name: Test library
        run: npx ng test ngx-json-render

      - name: Build Material catalog
        run: npm run build:material

      - name: Test Material catalog
        run: npm run test:material

  deploy-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      # The demo's playground renders the Material catalog, so the demo does
      # not compile until this is in dist/ too.
      - name: Build Material catalog
        run: npm run build:material

      - name: Build demo for GitHub Pages
        run: npx ng build demo --base-href /ngx-json-render/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo/browser

      - uses: actions/deploy-pages@v5
        id: deployment
