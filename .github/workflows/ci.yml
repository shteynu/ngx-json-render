name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Test library
        run: npx ng test ngx-json-render

      # Building the catalog type-checks every component template against it.
      - name: Build Material catalog
        run: npm run build:material

      # The catalog's runner reports its results and then never exits (see
      # projects/ngx-json-render-material/README.md), so this goes through a
      # script that waits for the report rather than for the process.
      - name: Test Material catalog
        run: npm run test:material

      - name: Test demo
        run: npx ng test demo

      - name: Build demo
        run: npx ng build demo

      - name: Upload library package
        uses: actions/upload-artifact@v7
        with:
          name: ngx-json-render
          path: dist/ngx-json-render

      - name: Upload Material catalog package
        uses: actions/upload-artifact@v7
        with:
          name: ngx-json-render-material
          path: dist/ngx-json-render-material

  angular-compat:
    name: Angular ${{ matrix.angular }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: [20]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Retarget workspace to Angular ${{ matrix.angular }}
        run: node scripts/angular-compat.mjs ${{ matrix.angular }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build library
        run: npx ng build ngx-json-render

      - name: Test library
        run: npx ng test ngx-json-render

      - name: Build Material catalog
        run: npx ng build ngx-json-render-material

  deploy-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Build demo for GitHub Pages
        run: npx ng build demo --base-href /ngx-json-render/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo/browser

      - uses: actions/deploy-pages@v5
        id: deployment
